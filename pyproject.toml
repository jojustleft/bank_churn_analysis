[project]
name = "bank-churn-analysis"
version = "0.1.0"
description = "Analysis on bank customer churn"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastexcel>=0.20.2",
    "jupyterlab>=4.5.8",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.2",
    "quoi",
    "scikit-learn>=1.9.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "kaleido>=1.3.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 120

[tool.uv.sources]
quoi = { git = "https://github.com/jojustleft/quoi" }
